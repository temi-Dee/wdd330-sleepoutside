<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />

    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <h2>Product Categories</h2>
        <div class="category-cards">
          <a href="/product_listing/?category=tents" class="category-card">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" aria-hidden="true" focusable="false">
              <polygon points="50,5 5,75 95,75" fill="#4a7c59" stroke="#2d4a35" stroke-width="2"/>
              <line x1="50" y1="5" x2="50" y2="75" stroke="#2d4a35" stroke-width="1.5"/>
            </svg>
            <h3>Tents</h3>
          </a>
          <a href="/product_listing/?category=backpacks" class="category-card">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <rect x="20" y="20" width="60" height="70" rx="10" ry="10" fill="#7a5c3d" stroke="#4a3520" stroke-width="2"/>
              <rect x="35" y="10" width="30" height="20" rx="8" ry="8" fill="#7a5c3d" stroke="#4a3520" stroke-width="2"/>
              <rect x="30" y="40" width="40" height="25" rx="5" ry="5" fill="none" stroke="#4a3520" stroke-width="2"/>
            </svg>
            <h3>Backpacks</h3>
          </a>
          <a href="/product_listing/?category=sleeping-bags" class="category-card">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <ellipse cx="50" cy="55" rx="30" ry="40" fill="#3d6b8a" stroke="#1e3d52" stroke-width="2"/>
              <ellipse cx="50" cy="25" rx="20" ry="18" fill="#3d6b8a" stroke="#1e3d52" stroke-width="2"/>
              <line x1="50" y1="7" x2="50" y2="95" stroke="#1e3d52" stroke-width="1.5"/>
            </svg>
            <h3>Sleeping Bags</h3>
          </a>
          <a href="/product_listing/?category=hammocks" class="category-card">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" aria-hidden="true" focusable="false">
              <line x1="5" y1="10" x2="95" y2="10" stroke="#4a3520" stroke-width="3" stroke-linecap="round"/>
              <path d="M10,10 Q50,55 90,10" fill="#8b6914" stroke="#4a3520" stroke-width="2"/>
              <line x1="5" y1="55" x2="10" y2="10" stroke="#4a3520" stroke-width="2"/>
              <line x1="95" y1="55" x2="90" y2="10" stroke="#4a3520" stroke-width="2"/>
            </svg>
            <h3>Hammocks</h3>
          </a>
        </div>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
