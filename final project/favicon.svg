<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Navy background -->
  <rect width="64" height="64" rx="12" fill="#0F1B2D"/>

  <!-- Film reel outer ring -->
  <circle cx="32" cy="30" r="16" fill="none" stroke="#F5B301" stroke-width="3"/>
  <!-- Reel hub -->
  <circle cx="32" cy="30" r="5" fill="#F5B301"/>
  <!-- Reel spokes -->
  <line x1="32" y1="14" x2="32" y2="20" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="46" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="22" y2="30" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="30" x2="48" y2="30" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20.7" y1="18.7" x2="25" y2="23" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="39" y1="37" x2="43.3" y2="41.3" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43.3" y1="18.7" x2="39" y2="23" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="25" y1="37" x2="20.7" y2="41.3" stroke="#F5B301" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Popcorn kernel (bottom-right) -->
  <ellipse cx="47" cy="52" rx="5" ry="6" fill="#F5B301"/>
  <ellipse cx="47" cy="49" rx="3" ry="2.5" fill="#0F1B2D" opacity="0.4"/>
</svg>
